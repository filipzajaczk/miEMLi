{% extends "base.html" %}
{% block tytul %}Logowanie · miemli{% endblock %}
{% block tresc %}
<main class="tresc">
  <div class="waska karta">
    <h1>Logowanie</h1>
    {% if form.errors %}<div class="blad">Nieprawidłowy login lub hasło.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Login</label>
      <input type="text" name="username" id="id_username" autofocus required>
      <label for="id_password">Hasło</label>
      <input type="password" name="password" id="id_password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn primary" type="submit">Zaloguj</button>
    </form>
  </div>
</main>
{% endblock %}
