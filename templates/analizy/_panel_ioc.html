{% load miemli %}
<div class="label">IOC · {{ ioc|length }}</div>
{% for i, glebokosc in ioc %}
  <a class="wiersz-ioc" href="?sekcja=ioc&wiadomosc={{ wid }}" hx-get="?sekcja=ioc&wiadomosc={{ wid }}"
     hx-target="#glowna" hx-push-url="true">
    <span class="typ">{{ i.typ }}</span>
    <span class="mono wartosc">{% if glebokosc %}<span class="muted">└ </span>{% endif %}{% if i.typ == "plik" %}{{ i.etykieta }}{% else %}{{ i|rozbrojony }}{% endif %}</span>
  </a>
{% empty %}
  <p class="muted">Nie znaleziono IOC.</p>
{% endfor %}
