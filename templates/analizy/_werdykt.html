{% load miemli %}<form class="werdykt" hx-post="{% url 'analizy:werdykt' analiza.pk %}" hx-swap="outerHTML"
      aria-label="Werdykt analityka, widoczny na liście analiz">
  {% csrf_token %}
  <div class="werdykt-tytul"><span>Werdykt</span>{% if analiza.werdykt %}<button class="link" type="submit" name="werdykt" value="">Wyczyść</button>{% endif %}</div>
  <div class="przyciski">
    {% for kod, nazwa in werdykty %}
      <button type="submit" name="werdykt" value="{{ kod }}" data-skrot="{{ kod|skrot_werdyktu }}"
              class="{{ kod|klasa_werdyktu_analityka }}{% if analiza.werdykt == kod %} on{% endif %}"
              aria-pressed="{% if analiza.werdykt == kod %}true{% else %}false{% endif %}"
              title="Skrót klawiszowy: {{ kod|skrot_werdyktu }}">{{ nazwa }}<kbd>{{ kod|skrot_werdyktu }}</kbd></button>
    {% endfor %}
  </div>
</form>
