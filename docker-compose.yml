# Sekrety pochodzą z .env (interpolacja), ale każdy kontener dostaje tylko te, których potrzebuje.
# Sieci: "wewnetrzna" nie ma wyjścia do internetu; do internetu wychodzą tylko caddy i worker.
# "piaskownica": wyłącznie web ↔ parser. Parser nie widzi bazy, Redisa ani internetu.

x-utwardzenie: &utwardzenie
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  tmpfs:
    - /tmp:size=64m,noexec,nosuid,nodev
    - /home/miemli/.gunicorn:size=1m,noexec,nosuid,nodev,uid=1000,gid=1000

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MIEMLI_HOST: ${MIEMLI_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [wewnetrzna, zewnetrzna]
    depends_on:
      - web

  parser:
    build:
      context: .
      target: parser
    restart: unless-stopped
    runtime: ${PARSER_RUNTIME:-runc}  # produkcja: runsc (gVisor)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2560m
    pids_limit: 64
    tmpfs:
      - /tmp:size=300m,noexec,nosuid,nodev,uid=65534,gid=65534
    # celowo bez żadnych zmiennych z sekretami
    networks: [piaskownica]

  web:
    <<: *utwardzenie
    build:
      context: .
      target: web
    restart: unless-stopped
    mem_limit: 1g
    environment:
      RUN_MIGRATIONS: "1"
      SECRET_KEY: ${SECRET_KEY:?ustaw SECRET_KEY w .env}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
      SECURE_COOKIES: ${SECURE_COOKIES:-1}
      DATABASE_URL: ${DATABASE_URL:?ustaw DATABASE_URL w .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?ustaw REDIS_PASSWORD w .env}@redis:6379/0
      MIEMLI_IGNOROWANE_DOMENY: ${MIEMLI_IGNOROWANE_DOMENY:-}
      # web nie dostaje kluczy API — tylko informację, którzy dostawcy są włączeni
      GTI_WLACZONE: ${GTI_API_KEY:+1}
      CENSYS_WLACZONE: ${CENSYS_API_TOKEN:+1}
      PIASKOWNICA_URL: http://parser:8000
      # Joe: web tylko szyfruje klucze analityków (klucz publiczny)
      JOE_KLUCZ_PUBLICZNY: ${JOE_KLUCZ_PUBLICZNY:-}
      JOE_LIMIT_DZIENNY: ${JOE_LIMIT_DZIENNY:-20}
      PARSER_WYMAGA_GVISOR: ${PARSER_WYMAGA_GVISOR:-0}
    networks: [wewnetrzna, piaskownica]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      parser:
        condition: service_started

  worker:
    <<: *utwardzenie
    build:
      context: .
      target: web
    restart: unless-stopped
    mem_limit: 1g  # wysyłka 50 MB maila do Joe: szyfrogram + odszyfrowane kopie w pamięci
    command: ["python", "manage.py", "rqworker", "default", "--with-scheduler",
              "--serializer", "rq.serializers.JSONSerializer", "--worker-class", "analizy.rq_worker.WorkerMiemli"]
    environment:
      SECRET_KEY: ${SECRET_KEY:?ustaw SECRET_KEY w .env}
      DATABASE_URL: ${DATABASE_URL:?ustaw DATABASE_URL w .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?ustaw REDIS_PASSWORD w .env}@redis:6379/0
      GTI_API_KEY: ${GTI_API_KEY:-}
      CENSYS_API_TOKEN: ${CENSYS_API_TOKEN:-}
      CENSYS_ORG_ID: ${CENSYS_ORG_ID:-}
      # Joe: klucz prywatny WYŁĄCZNIE tutaj — odszyfrowuje klucze analityków i pliki do wysyłki
      JOE_KLUCZ_PUBLICZNY: ${JOE_KLUCZ_PUBLICZNY:-}
      JOE_KLUCZ_PRYWATNY: ${JOE_KLUCZ_PRYWATNY:-}
      JOE_API_URL: ${JOE_API_URL:-https://jbxcloud.joesecurity.org/api}
    networks: [wewnetrzna, zewnetrzna]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: miemli
      POSTGRES_USER: miemli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    networks: [wewnetrzna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miemli -d miemli"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # bez zrzutów na dysk: w kolejce bywają (zaszyfrowane) pliki do Joe
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?ustaw REDIS_PASSWORD w .env}",
              "--save", "", "--appendonly", "no"]
    security_opt: ["no-new-privileges:true"]
    networks: [wewnetrzna]

networks:
  wewnetrzna:
    internal: true
  piaskownica:
    internal: true
  zewnetrzna: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
