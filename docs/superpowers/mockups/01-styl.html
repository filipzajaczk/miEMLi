<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>miemli – kierunek stylu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", "Segoe UI", system-ui, sans-serif; background: #e9e9e6; color: #222; padding: 32px; }
  h1 { font-weight: 500; font-size: 22px; margin-bottom: 6px; }
  .lead { color: #666; margin-bottom: 28px; font-size: 14px; }
  .variant { margin-bottom: 48px; }
  .variant > h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .variant > p { font-size: 13px; color: #666; margin-bottom: 12px; }

  /* --- wspólny szkielet makiety --- */
  .app { background: var(--bg); color: var(--fg); border-radius: 10px; overflow: hidden; border: 1px solid var(--line); font-size: 13px; }
  .top { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid var(--line); }
  .logo { font-weight: 600; letter-spacing: .06em; }
  .ticket { color: var(--muted); }
  .top .sp { flex: 1; }
  .btn { border: 1px solid var(--line); background: transparent; color: var(--fg); padding: 6px 12px; border-radius: 6px; font: inherit; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; }
  .pane { padding: 22px; }
  .pane + .pane { border-left: 1px solid var(--line); background: var(--bg2); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .subject { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
  .meta { color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
  .meta b { color: var(--fg); font-weight: 500; }
  .badges { display: flex; gap: 6px; margin-bottom: 16px; }
  .b { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .03em; }
  .ok { background: var(--ok-bg); color: var(--ok); }
  .bad { background: var(--bad-bg); color: var(--bad); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .body { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 16px; line-height: 1.6; }
  .body a { color: var(--accent); }
  .ioc { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .ioc .t { width: 54px; color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .ioc .v { flex: 1; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
  .ioc .tree { color: var(--muted); padding-left: 64px; font-size: 12px; }

  /* --- A: Nordic jasny --- */
  .a { --bg:#f7f7f5; --bg2:#f0f0ed; --card:#fff; --fg:#2b2f33; --muted:#8a9096; --line:#e1e1dc;
       --accent:#4c6a85; --on-accent:#fff;
       --ok:#4f7a5a; --ok-bg:#e3ece4; --bad:#a3544a; --bad-bg:#f3e1de; --warn:#93743a; --warn-bg:#f2eadb; }
  /* --- B: Nord ciemny --- */
  .b-var { --bg:#2e3440; --bg2:#2a2f3a; --card:#353c4a; --fg:#e5e9f0; --muted:#8892a6; --line:#3f4656;
       --accent:#88c0d0; --on-accent:#2e3440;
       --ok:#a3be8c; --ok-bg:#3a4639; --bad:#d08770; --bad-bg:#4a3a38; --warn:#ebcb8b; --warn-bg:#4a4535; }
  /* --- C: ciepły skandynawski (papier, brzoza, mech) --- */
  .c { --bg:#f4f0e8; --bg2:#ece6da; --card:#fbf9f4; --fg:#2f2a24; --muted:#8c8273; --line:#ddd5c6;
       --accent:#5e6e4f; --on-accent:#fbf9f4;
       --ok:#5e6e4f; --ok-bg:#e1e5d6; --bad:#9c4f3c; --bad-bg:#efdcd3; --warn:#8f6d2f; --warn-bg:#efe3cc; }
</style>
</head>
<body>
<h1>Kierunek stylu: który jest najbliżej Twojego „nordic”?</h1>
<p class="lead">Ten sam ekran analizy w trzech paletach. Na razie chodzi tylko o klimat (kolory, kontrast, ciężar), nie o układ – ten dopracujemy osobno.</p>

<script>
const mock = (cls) => `
<div class="app ${cls}">
  <div class="top">
    <span class="logo">miemli</span>
    <span class="ticket">RTIR #48213 · faktura_marzec.eml</span>
    <span class="sp"></span>
    <button class="btn">Odśwież wzbogacenie</button>
    <button class="btn primary">Wyślij do RTIR</button>
  </div>
  <div class="grid">
    <div class="pane">
      <div class="label">Wiadomość</div>
      <div class="subject">Zaległa płatność – faktura FV/03/2026</div>
      <div class="meta">
        Od: <b>Księgowość PKO</b> &lt;ksiegowosc@pko-platnosci.com&gt;<br>
        Reply-To: <b>pko.rozliczenia@gmail.com</b><br>
        Do: jan.kowalski@firma.pl · 24.10.2026 09:14
      </div>
      <div class="badges">
        <span class="b bad">SPF FAIL</span><span class="b ok">DKIM PASS</span><span class="b bad">DMARC FAIL</span><span class="b warn">REPLY-TO ≠ FROM</span>
      </div>
      <div class="body">
        Dzień dobry,<br><br>
        w załączniku przesyłamy fakturę. Prosimy o uregulowanie płatności w ciągu 24h, w przeciwnym razie konto zostanie zablokowane.<br><br>
        <a href="#">Pobierz fakturę (pko.pl)</a>
      </div>
    </div>
    <div class="pane">
      <div class="label">IOC</div>
      <div class="ioc"><span class="t">plik</span><span class="v">faktura.zip</span><span class="b warn">GTI 3/70</span></div>
      <div class="ioc"><span class="tree">└ faktura.exe · sha256 9f2c…a41b</span><span class="b bad">GTI 41/70</span></div>
      <div class="ioc"><span class="t">url</span><span class="v">hxxps://pko-platnosci[.]com/fv</span><span class="b bad">GTI 12/90</span></div>
      <div class="ioc"><span class="t">domena</span><span class="v">pko-platnosci[.]com</span><span class="b warn">3 dni</span></div>
      <div class="ioc"><span class="t">ip</span><span class="v">185.243.115[.]20</span><span class="b ok">Censys</span></div>
    </div>
  </div>
</div>`;
const variants = [
  ['a', 'A · Nordic jasny', 'Chłodna biel, grafit, przygaszony stalowy niebieski. Dużo powietrza, jak skandynawskie biuro.'],
  ['b-var', 'B · Nord ciemny', 'Paleta „Nord” (Polar Night + Frost). Ciemny, spokojny, dobry na długie zmiany przy monitorze.'],
  ['c', 'C · Ciepły skandynawski', 'Papier, brzoza, mech. Mniej techniczny, bardziej „hygge”, łagodny dla oczu.'],
];
for (const [cls, title, desc] of variants) {
  document.write(`<section class="variant"><h2>${title}</h2><p>${desc}</p>${mock(cls)}</section>`);
}
</script>
</body>
</html>
